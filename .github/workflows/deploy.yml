name: Deploy Spring Boot

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "target/*.jar"
          target: "/opt/autoescuela/"
          strip_components: 1

      - name: Deploy & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/autoescuela

            # Subir el nuevo JAR excluyendo el app.jar actual
            NEW_JAR=$(ls *.jar | grep -v "app.jar" | head -n 1)

            if [ -z "$NEW_JAR" ]; then
              echo "Error: No se encontró ningún archivo JAR nuevo."
              exit 1
            fi

            echo "Renombrando $NEW_JAR a app.jar..."
            
            # Borro el viejo y renombro el nuevo
            rm -f app.jar
            mv "$NEW_JAR" app.jar

            sudo systemctl restart autoescuela