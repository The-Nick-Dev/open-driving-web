# Base de datos en memoria para tests — no toca la BD de producción
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT — cualquier clave >=32 chars es válida para tests
jwt.secret=clave-de-prueba-suficientemente-larga-para-hmac-sha256
jwt.expiration=3600000

# Mail — deshabilitado en tests (los servicios se mockean)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
