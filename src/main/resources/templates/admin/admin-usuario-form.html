<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Formulario Usuario - Autoescuela</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/jwt-helper.js"></script>
</head>
<body class="admin-layout">

    <div class="sidebar">
        <h3 id="nombreEmpresa"></h3>
        <ul>
            <li><a href="/admin/dashboard">Panel principal</a></li>
            <li><a href="/admin/usuarios" class="active">Usuarios</a></li>
            <li><a href="/admin/ajustes">Ajustes</a></li>
        </ul>
        <div class="logout-form">
            <button type="button" onclick="logout()" class="btn-primary" style="width:100%;">Cerrar sesión</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="tituloForm">Crear Nuevo Usuario</h1>
        </div>

        <div class="content-area">
            <div id="errorMsg" style="display:none; padding:15px; background:#f8d7da; color:#721c24; border-radius:5px; margin-bottom:15px;"></div>
            
            <div class="card">
                <form id="usuarioForm" class="form-container">
                    <input type="hidden" id="usuarioId" value="">

                    <div class="form-group">
                        <label for="username">Nombre de Usuario *</label>
                        <input type="text" id="username" name="username" required class="form-control">
                        <small id="usernameHelp" style="display:none;">Este campo no puede ser modificado</small>
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico *</label>
                        <input type="email" id="correo" name="correo" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol *</label>
                        <select id="rol" name="rol" required class="form-control">
                            <option value="">-- Seleccionar Rol --</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="PROFESOR">PROFESOR</option>
                            <option value="ALUMNO">ALUMNO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Contraseña<span id="passwordReq"> *</span>
                        </label>
                        <input type="password" id="password" name="password" class="form-control">
                        <small id="passwordHelp" style="display:none;">Dejar en blanco si no deseas cambiarla</small>
                    </div>

                    <div class="form-group">
                        <label for="fechaExpiracion">Fecha de Expiración</label>
                        <input type="date" id="fechaExpiracion" name="fechaExpiracion" class="form-control">
                        <small>Dejar en blanco si no tiene fecha de expiración</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="btnSubmit">Crear Usuario</button>
                        <a href="/admin/usuarios" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        if (!checkAuth()) { throw new Error('No auth'); }

        const pathParts = window.location.pathname.split('/');
        const editarIndex = pathParts.indexOf('editar');
        const usuarioId = editarIndex > 0 ? pathParts[editarIndex - 1] : null;

        if (usuarioId) {
            document.getElementById('pageTitle').textContent = 'Editar Usuario - Autoescuela';
            document.getElementById('tituloForm').textContent = 'Editar Usuario';
            document.getElementById('btnSubmit').textContent = 'Guardar Cambios';
            document.getElementById('password').required = false;
            document.getElementById('passwordReq').style.display = 'none';
            document.getElementById('passwordHelp').style.display = 'inline';
            document.getElementById('username').disabled = true;
            document.getElementById('usernameHelp').style.display = 'inline';
        }

        document.getElementById('usuarioForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('usuarioId').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const rol = document.getElementById('rol').value;
            const fechaExpiracion = document.getElementById('fechaExpiracion').value;

            const body = { username, nombre, correo, rol };
            if (password) body.password = password;
            if (fechaExpiracion) body.fechaExpiracion = fechaExpiracion;

            try {
                let response;
                if (id) {
                    response = await apiFetch(`/api/usuarios/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify(body)
                    });
                } else {
                    if (!password) {
                        document.getElementById('errorMsg').textContent = 'La contraseña es obligatoria para nuevos usuarios';
                        document.getElementById('errorMsg').style.display = 'block';
                        return;
                    }
                    response = await apiFetch('/api/usuarios', {
                        method: 'POST',
                        body: JSON.stringify(body)
                    });
                }

                if (response && response.ok) {
                    window.location.href = '/admin/usuarios?success=true';
                } else {
                    const error = await response.json();
                    document.getElementById('errorMsg').textContent = error.error || 'Error al guardar';
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Error de conexión';
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        showLoading();
        Promise.all([
            apiFetch('/api/nombre').then(r => r.json()).catch(() => null),
            usuarioId ? apiFetch(`/api/usuarios/${usuarioId}`).then(r => r.json()).catch(() => null) : Promise.resolve(null)
        ]).then(([ajustes, usuario]) => {
            if (ajustes && ajustes.nombreEmpresa) {
                document.getElementById('nombreEmpresa').textContent = ajustes.nombreEmpresa;
            }
            if (usuario) {
                document.getElementById('usuarioId').value = usuario.id;
                document.getElementById('username').value = usuario.username;
                document.getElementById('nombre').value = usuario.nombre || '';
                document.getElementById('correo').value = usuario.correo || '';
                document.getElementById('rol').value = usuario.rol;
                if (usuario.fechaExpiracion) {
                    document.getElementById('fechaExpiracion').value = usuario.fechaExpiracion.split('T')[0];
                }
            }
        }).finally(() => hideLoading());
    </script>
</body>
</html>
