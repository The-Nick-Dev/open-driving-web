<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada - 404</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/error.css">
    <script src="/js/jwt-helper.js"></script>
</head>
<body class="error-404">
    <div class="error-container">
        <h1>404</h1>
        <h2>¡Página no encontrada!</h2>
        <p>Lo sentimos, la página que buscas no existe o ha sido movida a otra dirección.</p>
        <a href="/login" class="btn-back">Volver al Login</a>
    </div>
    <script>
        if (isAuthenticated()) {
            document.querySelector('.btn-back').href = '/alumno/dashboard';
            if (getUser() && getUser().rol === 'ADMIN') {
                document.querySelector('.btn-back').href = '/admin/dashboard';
            } else if (getUser() && getUser().rol === 'PROFESOR') {
                document.querySelector('.btn-back').href = '/profesor/temas';
            }
        }
    </script>
</body>
</html>
