<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Preguntas - Autoescuela</title>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/profesor.css">
    <script src="/js/jwt-helper.js"></script>
</head>
<body class="admin-layout">
    <div class="sidebar">
        <h3 id="nombreEmpresa"></h3>
        <ul>
            <li><a href="/profesor/preguntas" class="active">Preguntas</a></li>
            <li><a href="/profesor/temas">Temas</a></li>
        </ul>
        <div class="logout-form">
            <button type="button" onclick="logout()" class="btn-primary" style="width:100%;">Cerrar sesión</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Gestión de Preguntas</h1>
        </div>

        <div id="successMsg" style="display:none; padding:15px; background:#d4edda; color:#155724; border-radius:5px; margin-bottom:15px;"></div>
        <div id="errorMsg" style="display:none; padding:15px; background:#f8d7da; color:#721c24; border-radius:5px; margin-bottom:15px;"></div>

        <div class="content-area">
            <div class="header-actions">
                <a href="/profesor/preguntas/nueva" class="btn-nuevo">Nueva Pregunta</a>
                <button class="btn-nuevo" onclick="abrirImportar()" style="background:#6c757d; margin-left:8px;">Importar</button>
            </div>

            <!-- Modal importación -->
            <div id="importModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
                <div style="background:#fff; border-radius:8px; padding:28px; width:460px; max-width:95%; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
                    <h3 style="margin:0 0 20px;">Importar preguntas</h3>

                    <div style="margin-bottom:14px;">
                        <label style="display:block; font-weight:600; margin-bottom:5px;">Formato</label>
                        <select id="importFormato" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                            <option value="moodle">Moodle XML</option>
                            <option value="blackboard">Blackboard (ZIP o QTI XML)</option>
                            <option value="examview">ExamView XML</option>
                            <option value="webct">WebCT (QTI XML)</option>
                            <option value="hotpotatoes">Hot Potatoes JQuiz (.jqz o XML)</option>
                        </select>
                    </div>

                    <div style="margin-bottom:14px;">
                        <label style="display:block; font-weight:600; margin-bottom:5px;">Tema destino</label>
                        <select id="importTema" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                            <option value="">-- Selecciona un tema --</option>
                        </select>
                    </div>

                    <div style="margin-bottom:18px;">
                        <label style="display:block; font-weight:600; margin-bottom:5px;">Archivo</label>
                        <input type="file" id="importFile" accept=".xml,.jqz,.zip"
                               style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                    </div>

                    <div id="importResult" style="display:none; padding:10px; border-radius:4px; margin-bottom:14px; font-size:0.9em;"></div>

                    <div style="display:flex; gap:10px; justify-content:flex-end;">
                        <button onclick="cerrarImportar()" style="padding:8px 18px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;">Cancelar</button>
                        <button onclick="ejecutarImportar()" id="importBtn" style="padding:8px 18px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Importar</button>
                    </div>
                </div>
            </div>

            <div class="filtro-tema">
                <strong>Filtrar por tema:</strong>
                <select id="temaSelect" onchange="filtrarPorTema()">
                    <option value="">-- Todos los temas --</option>
                </select>
                <!-- <button class="btn-filtrar" onclick="filtrarPorTema()">Filtrar</button> -->
                <!-- <button class="btn-filtrar" style="background-color:#6c757d;" onclick="limpiarFiltro()">Limpiar</button> -->
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Listado de Preguntas</h3>
                    <span id="totalPreguntas">0 preguntas encontradas</span>
                </div>
                
                <div id="preguntasContainer"></div>
                <div id="emptyState" style="display:none; text-align:center; padding:20px;">
                    <p>No hay preguntas disponibles.</p>
                    <a href="/profesor/preguntas/nueva" class="btn-nuevo">Crear primera pregunta</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (!checkAuth()) { throw new Error('No auth'); }

        function renderizarPreguntas(preguntas) {
            document.getElementById('emptyState').style.display = 'none';

            if (!preguntas || preguntas.error) {
                document.getElementById('errorMsg').textContent = 'Error al cargar preguntas';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            document.getElementById('totalPreguntas').textContent = preguntas.length + ' preguntas encontradas';

            if (preguntas.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('preguntasContainer').innerHTML = '';
                return;
            }

            const container = document.getElementById('preguntasContainer');
            container.innerHTML = '<table><thead><tr><th>Tema</th><th>Pregunta</th><th>Acciones</th></tr></thead><tbody id="preguntasBody"></tbody></table>';
            const tbody = document.getElementById('preguntasBody');

            preguntas.forEach(p => {
                const temaNombre = p.tema ? p.tema.nombre : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge-tema">${temaNombre}</span></td>
                        <td>${p.texto}</td>
                        <td>
                            <a href="/profesor/preguntas/${p.id}/editar" class="btn-editar">Editar</a>
                            <button onclick="eliminarPregunta(${p.id})" class="btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function cargarPreguntas(temaId) {
            let url = '/api/preguntas';
            if (temaId) url = `/api/preguntas/tema/${temaId}`;

            apiFetch(url).then(r => r.json()).then(renderizarPreguntas).catch(() => {
                document.getElementById('errorMsg').textContent = 'Error de conexión';
                document.getElementById('errorMsg').style.display = 'block';
            });
        }

        function filtrarPorTema() {
            const temaId = document.getElementById('temaSelect').value;
            cargarPreguntas(temaId);
        }

        function limpiarFiltro() {
            document.getElementById('temaSelect').value = '';
            cargarPreguntas();
        }

        async function eliminarPregunta(id) {
            if (!confirm('¿Estás seguro de eliminar esta pregunta?')) return;

            const response = await apiFetch(`/api/preguntas/${id}`, { method: 'DELETE' });
            if (response && response.ok) {
                const temaId = document.getElementById('temaSelect').value;
                cargarPreguntas(temaId || undefined);
            } else {
                alert('Error al eliminar pregunta');
            }
        }

        let temasCache = [];

        function abrirImportar() {
            const sel = document.getElementById('importTema');
            sel.innerHTML = '<option value="">-- Selecciona un tema --</option>';
            temasCache.forEach(t => {
                sel.innerHTML += `<option value="${t.id}">${t.nombre}</option>`;
            });
            document.getElementById('importResult').style.display = 'none';
            document.getElementById('importFile').value = '';
            document.getElementById('importModal').style.display = 'flex';
        }

        function cerrarImportar() {
            document.getElementById('importModal').style.display = 'none';
        }

        async function ejecutarImportar() {
            const formato = document.getElementById('importFormato').value;
            const temaId  = document.getElementById('importTema').value;
            const file    = document.getElementById('importFile').files[0];
            const result  = document.getElementById('importResult');
            const btn     = document.getElementById('importBtn');

            if (!temaId) { alert('Selecciona un tema destino.'); return; }
            if (!file)   { alert('Selecciona un archivo.'); return; }

            const form = new FormData();
            form.append('file', file);
            form.append('formato', formato);
            form.append('temaId', temaId);

            btn.disabled = true;
            btn.textContent = 'Importando…';
            result.style.display = 'none';

            try {
                const token = localStorage.getItem('jwt_token') || sessionStorage.getItem('jwt_token');
                const resp = await fetch('/api/preguntas/importar', {
                    method: 'POST',
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {},
                    body: form
                });
                const data = await resp.json();
                if (resp.ok) {
                    result.style.background = '#d4edda';
                    result.style.color = '#155724';
                    result.textContent = data.mensaje;
                    result.style.display = 'block';
                    const temaId2 = document.getElementById('temaSelect').value;
                    cargarPreguntas(temaId2 || undefined);
                    setTimeout(function () {
                        cerrarImportar();
                    }, 2000);
                } else {
                    result.style.background = '#f8d7da';
                    result.style.color = '#721c24';
                    result.textContent = data.error || 'Error desconocido';
                    result.style.display = 'block';
                }
            } catch (e) {
                result.style.background = '#f8d7da';
                result.style.color = '#721c24';
                result.textContent = 'Error de conexión';
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Importar';
            }
        }

        showLoading();
        Promise.all([
            apiFetch('/api/nombre').then(r => r.json()).catch(() => null),
            apiFetch('/api/temas/todos').then(r => r.json()).catch(() => []),
            apiFetch('/api/preguntas').then(r => r.json()).catch(() => [])
        ]).then(([ajustes, temas, preguntas]) => {
            if (ajustes && ajustes.nombreEmpresa) {
                document.getElementById('nombreEmpresa').textContent = ajustes.nombreEmpresa;
            }
            temasCache = temas.filter(t => t.activo !== false);
            const select = document.getElementById('temaSelect');
            temasCache.forEach(t => {
                select.innerHTML += `<option value="${t.id}">${t.nombre}</option>`;
            });
            renderizarPreguntas(preguntas);
        }).finally(() => hideLoading());
    </script>
</body>
</html>
